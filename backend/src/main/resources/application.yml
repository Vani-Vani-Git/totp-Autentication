spring:
  application:
    name: totp-authentication

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  spring:
    datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    encryption-key: ${TOTP_ENCRYPTION_KEY}
    jwt-secret: ${TOTP_JWT_SECRET}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
    temp-auth-session-ttl-seconds: 120
    password-recovery-code-ttl-minutes: 10

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}

server:
  port: 8080