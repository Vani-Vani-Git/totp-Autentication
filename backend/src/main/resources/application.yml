spring:
  application:
    name: totp-authentication

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    encryption-key: ${TOTP_ENCRYPTION_KEY}
    jwt-secret: ${TOTP_JWT_SECRET}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
    temp-auth-session-ttl-seconds: 120

server:
  port: ${PORT:10000}
  address: 0.0.0.0